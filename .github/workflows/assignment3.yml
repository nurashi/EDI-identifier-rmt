name: Assignment 3 Python pipeline

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rmt214
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: rmt214/requirements*.txt
      - name: Install Poppler
        run: sudo apt-get update -q && sudo apt-get install -y --no-install-recommends poppler-utils
      - run: python -m pip install -r requirements-dev.txt
      - name: Run fixture and regression tests
        run: python -m pytest -v tests --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: assignment3-test-results
          path: rmt214/test-results.xml
